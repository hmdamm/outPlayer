name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev libqt6opengl6-dev libqt6openglwidgets6-dev libqt6svg6-dev \
            libmpv-dev ffmpeg xvfb dpkg-dev rpm flatpak-builder python3 python3-pip

      - name: Configure CMake
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build outPlayer
        run: cmake --build build -j$(nproc)

      - name: Run CTest test suite
        run: QT_QPA_PLATFORM=offscreen xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Run packaging and spec tests
        run: |
          python3 tests/test_packaging_assets.py
          python3 tests/test_flatpak_manifest.py
          python3 tests/test_debian_packaging.py
          python3 tests/test_rpm_arch_packaging.py
          python3 tests/test_appimage_packaging.py
          python3 tests/test_phase1_specs.py
          python3 tests/test_project_scaffold.py
