<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Plate Gradient -->
    <radialGradient id="plateGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a2a2e"/>
      <stop offset="60%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </radialGradient>

    <!-- Outer Bezel Metallic Gradient -->
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Amber Accent Gradient -->
    <linearGradient id="amberRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffbe33"/>
      <stop offset="50%" stop-color="#ffaa00"/>
      <stop offset="100%" stop-color="#e67e00"/>
    </linearGradient>

    <!-- Inner Core Gradient -->
    <radialGradient id="innerCore" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#242429"/>
      <stop offset="100%" stop-color="#121214"/>
    </radialGradient>

    <!-- Play Glyph Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Amber Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Squircle with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108"
        fill="url(#plateGrad)" stroke="url(#bezelGrad)" stroke-width="4"
        filter="url(#dropShadow)"/>

  <!-- Subtle Inner Inset Border -->
  <rect x="28" y="28" width="456" height="456" rx="104" ry="104"
        fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Concentric Amber Accent Ring -->
  <circle cx="256" cy="256" r="162"
          fill="none" stroke="url(#amberRing)" stroke-width="7"
          filter="url(#amberGlow)" stroke-linecap="round"/>

  <!-- Inner Dark Chamber -->
  <circle cx="256" cy="256" r="148"
          fill="url(#innerCore)" stroke="#27272a" stroke-width="2"/>

  <!-- Modern Sharp Play Glyph (Forward ▶) with Smooth Corners -->
  <path d="M 216 172
           C 216 162 227 156 236 162
           L 344 246
           C 352 251 352 261 344 266
           L 236 350
           C 227 356 216 350 216 340
           Z"
        fill="url(#glyphGrad)"
        filter="url(#dropShadow)"/>
</svg>
